<div class="modal-card p-4 animate-float" [class]="getBorderClass()">
  
  <div class="modal-header d-flex justify-content-between align-items-center mb-3">
    <h3 class="modal-title m-0 text-white">{{ data.title }}</h3>
    <button class="btn-close-cyber" (click)="dialogRef.close()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
  
  <div class="modal-body mb-4">
    <p class="modal-text m-0">{{ data.message }}</p>
  </div>
  
  <div class="modal-footer text-end">
    <button class="btn btn-cyber-cyan text-uppercase" (click)="dialogRef.close()">
      Aceptar
    </button>
  </div>

</div>
